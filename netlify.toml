[build]
  # Publish ONLY public files: make_public.sh copies pages, CSS/JS, images, sitemap, robots and the
  # IndexNow key into _public/. Repo notes, scripts, data JSON and seeds are never served.
  command = "sh make_public.sh"
  publish = "_public"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"
